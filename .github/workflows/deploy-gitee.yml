name: Deploy to Gitee Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: npm ci && npm run build

      - name: Push to Gitee
        run: |
          cd dist
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "deploy: Gitee Pages"
          git branch -M master
          git push -f "https://oauth2:${GITEE_TOKEN}@gitee.com/Cindylanlan/block-blast.git" master:master
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

      - name: Trigger Gitee Pages
        uses: yanglbme/gitee-pages-action@main
        with:
          gitee-username: Cindylanlan
          gitee-password: ${{ secrets.GITEE_PASSWORD }}
          gitee-repo: Cindylanlan/block-blast
          branch: master
